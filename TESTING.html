<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AFCOlite - Social Media Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #000;
            color: #fff;
            display: flex;
            min-height: 100vh;
            font-size: 15px;
        }

        .container {
            display: flex;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .sidebar {
            width: 250px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .sidebar-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .sidebar-item:hover, .sidebar-item.active {
            background-color: #1a1a1a;
        }

        .sidebar-item i {
            font-size: 20px;
            color: #fff;
        }

        .sidebar-item span {
            font-size: 16px;
            font-weight: 500;
        }

        .main-content {
            flex: 1;
            padding: 20px;
            border-left: 1px solid #2f3336;
            border-right: 1px solid #2f3336;
            max-width: 600px;
        }

        .header {
            font-size: 20px;
            font-weight: 800;
            padding: 10px 0;
            border-bottom: 1px solid #2f3336;
        }

        .post-form {
            padding: 15px 0;
            border-bottom: 1px solid #2f3336;
            display: none;
        }

        .post-form textarea {
            width: 100%;
            background-color: transparent;
            border: none;
            color: #fff;
            font-size: 20px;
            resize: none;
            padding: 10px;
        }

        .post-form textarea:focus {
            outline: none;
        }

        .post-form .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        .post-form .actions i {
            color: #1DA1F2;
            cursor: pointer;
            font-size: 18px;
            margin-right: 10px;
        }

        .post-form button {
            background-color: #1DA1F2;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .post-form button:hover {
            background-color: #0d8ece;
        }

        .posts {
            padding-top: 10px;
        }

        .post {
            padding: 15px;
            border-bottom: 1px solid #2f3336;
            transition: background-color 0.2s;
        }

        .post:hover {
            background-color: #0d0d0d;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .post-header img, .comment img, .profile-header img {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-header img {
            width: 100px;
            height: 100px;
        }

        .post-header img[onerror], .comment img[onerror], .profile-header img[onerror] {
            font-size: 24px;
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #2f3336;
            border-radius: 50%;
        }

        .profile-header img[onerror] {
            font-size: 48px;
            width: 100px;
            height: 100px;
        }

        .post-header .username {
            font-weight: 700;
            font-size: 15px;
        }

        .post-header .handle {
            color: #71767b;
            font-size: 15px;
        }

        .verified-badge {
            color: #1DA1F2;
            margin-left: 5px;
            font-size: 14px;
        }

        .post-content {
            margin: 10px 0;
            font-size: 15px;
            line-height: 1.4;
        }

        .post-actions {
            display: flex;
            gap: 40px;
            color: #71767b;
            font-size: 14px;
        }

        .post-actions i {
            cursor: pointer;
        }

        .post-actions .liked {
            color: #f91880;
        }

        .post-actions .shared {
            color: #00ba7c;
        }

        .comment-section {
            margin-top: 10px;
            padding-left: 20px;
        }

        .comment {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .comment img {
            width: 32px;
            height: 32px;
        }

        .comment-content {
            flex: 1;
        }

        .comment-form {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            position: relative;
        }

        .comment-form input {
            flex: 1;
            background-color: #1a1a1a;
            border: none;
            border-radius: 10px;
            padding: 8px;
            color: #fff;
        }

        .comment-form button {
            background-color: #1DA1F2;
            border: none;
            border-radius: 10px;
            padding: 8px 16px;
            color: #fff;
            cursor: pointer;
        }

        .sticker-picker {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            background: #1a1a1a;
            border: 1px solid #2f3336;
            border-radius: 10px;
            padding: 10px;
            z-index: 10;
        }

        .sticker-picker span {
            font-size: 24px;
            margin: 5px;
            cursor: pointer;
        }

        .explore-form {
            padding: 15px 0;
            border-bottom: 1px solid #2f3336;
            display: none;
        }

        .explore-form input {
            width: 100%;
            background-color: #1a1a1a;
            border: none;
            border-radius: 20px;
            padding: 10px;
            color: #fff;
            font-size: 16px;
        }

        .notifications {
            padding-top: 10px;
            display: none;
        }

        .notification {
            padding: 15px;
            border-bottom: 1px solid #2f3336;
        }

        .profile {
            padding-top: 10px;
            display: none;
        }

        .profile-header {
            text-align: center;
            padding: 20px;
            border-bottom: 1px solid #2f3336;
        }

        .profile-header h2 {
            font-size: 18px;
            font-weight: 700;
        }

        .profile-header p {
            color: #71767b;
            margin: 5px 0;
        }

        .profile-header button {
            background-color: #1DA1F2;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            cursor: pointer;
            margin-top: 10px;
        }

        #loginModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loginModal div {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 10px;
            width: 300px;
        }

        #loginModal input, #editProfileForm input, #editProfileForm textarea {
            display: block;
            width: 100%;
            margin: 10px 0;
            padding: 8px;
            background: #2f3336;
            border: none;
            border-radius: 5px;
            color: #fff;
        }

        #loginModal button, #editProfileForm button {
            background: #1DA1F2;
            border: none;
            border-radius: 20px;
            padding: 8px 16px;
            color: #fff;
            cursor: pointer;
            margin: 5px;
        }

        #editProfileForm {
            background: #1a1a1a;
            border-radius: 10px;
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 60px;
            }

            .sidebar-item span {
                display: none;
            }

            .main-content {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div id="loginModal">
        <div>
            <h2>Login</h2>
            <input type="text" id="loginUsername" placeholder="Username">
            <input type="password" id="loginPassword" placeholder="Password">
            <button onclick="login()">Login</button>
            <h2>Sign Up</h2>
            <input type="text" id="signupUsername" placeholder="Username">
            <input type="text" id="signupHandle" placeholder="Handle (e.g., @User)">
            <input type="password" id="signupPassword" placeholder="Password">
            <button onclick="signup()">Sign Up</button>
        </div>
    </div>
    <div class="container">
        <div class="sidebar">
            <div class="sidebar-item" onclick="showPage('home')"><i class="fas fa-dove"></i><span>AFCOlite</span></div>
            <div class="sidebar-item" onclick="showPage('home')"><i class="fas fa-home"></i><span>Home</span></div>
            <div class="sidebar-item" onclick="showPage('explore')"><i class="fas fa-search"></i><span>Explore</span></div>
            <div class="sidebar-item" onclick="showPage('notifications')"><i class="fas fa-bell"></i><span>Notifications</span></div>
            <div class="sidebar-item" onclick="showPage('profile')"><i class="fas fa-user"></i><span>Profile</span></div>
            <div class="sidebar-item" onclick="logout()"><i class="fas fa-sign-out-alt"></i><span>Logout</span></div>
        </div>
        <div class="main-content">
            <div class="header" id="header">Home</div>
            <div class="post-form" id="postForm">
                <textarea id="postContent" rows="3" placeholder="What's happening?"></textarea>
                <div class="actions">
                    <div>
                        <i class="fas fa-dove" onclick="toggleStickerPicker('postStickerPicker')"></i>
                        <i class="fas fa-image"></i>
                        <i class="fas fa-video"></i>
                        <i class="fas fa-poll"></i>
                        <div class="sticker-picker" id="postStickerPicker">
                            <span onclick="addSticker('postContent', '🕊️')">🕊️</span>
                            <span onclick="addSticker('postContent', '🦜')">🦜</span>
                            <span onclick="addSticker('postContent', '🦅')">🦅</span>
                            <span onclick="addSticker('postContent', '🐦')">🐦</span>
                            <span onclick="addSticker('postContent', '🦢')">🦢</span>
                        </div>
                    </div>
                    <button onclick="createPost()">Post</button>
                </div>
            </div>
            <div class="explore-form" id="exploreForm">
                <input type="text" id="searchInput" placeholder="Search AFCOlite" oninput="searchPosts()">
            </div>
            <div class="notifications" id="notifications"></div>
            <div class="profile" id="profile"></div>
            <div class="posts" id="postsContainer"></div>
        </div>
    </div>
    <script>
        // JSONBin.io Configuration
        const JSONBIN_BIN_ID = '684adcbb8960c979a5a89f8b';
        const JSONBIN_X_MASTER_KEY = '$2a$10$47gr4/kwbou3AGBRxw0ezuwkGNmHgdjGK1kd2dfMAoNgqtqyscdoG';
        const JSONBIN_URL = `https://api.jsonbin.io/v3/b/${JSONBIN_BIN_ID}`;

        // Default profile picture (donation-themed)
        const DEFAULT_PROFILE_PIC = 'https://images.unsplash.com/photo-1579621970795-87facc2f976d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80'


        // Get current user from localStorage
        let currentUser = JSON.parse(localStorage.getItem('currentUser'));

        // Show login modal if not logged in
        if (!currentUser) {
            document.getElementById('loginModal').style.display = 'flex';
        }

        // Login function
        async function login() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            if (!username || !password) {
                alert('Please enter username and password.');
                return;
            }

            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const users = data.record.users || [];
                const user = users.find(u => u.username === username && u.password === password);
                if (user) {
                    currentUser = user;
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));
                    document.getElementById('loginModal').style.display = 'none';
                    showPage('home');
                } else {
                    alert('Invalid username or password.');
                }
            } catch (error) {
                console.error('Error logging in:', error);
                alert('Failed to log in. Please try again.');
            }
        }

        // Signup function
        async function signup() {
            const username = document.getElementById('signupUsername').value.trim();
            const handle = document.getElementById('signupHandle').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            if (!username || !handle || !password) {
                alert('Please fill all fields.');
                return;
            }
            if (!handle.startsWith('@')) {
                alert('Handle must start with @.');
                return;
            }

            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const users = data.record.users || [];
                if (users.find(u => u.username === username)) {
                    alert('Username already exists.');
                    return;
                }
                if (users.find(u => u.handle === handle)) {
                    alert('Handle already exists.');
                    return;
                }

                const newUser = {
                    username,
                    handle,
                    password,
                    profilePic: DEFAULT_PROFILE_PIC,
                    bio: 'Welcome to AFCOlite! 🕊️',
                    joined: new Date().toLocaleDateString(),
                    verified: false
                };
                users.push(newUser);

                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_X_MASTER_KEY
                    },
                    body: JSON.stringify({ ...data.record, users })
                });

                currentUser = newUser;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                document.getElementById('loginModal').style.display = 'none';
                showPage('home');
            } catch (error) {
                console.error('Error signing up:', error);
                alert('Failed to sign up. Please try again.');
            }
        }

        // Page navigation
        function showPage(page) {
            if (!currentUser) return;
            document.querySelectorAll('.sidebar-item').forEach(item => item.classList.remove('active'));
            document.querySelector(`.sidebar-item[onclick="showPage('${page}')"]`).classList.add('active');
            document.getElementById('header').textContent = page.charAt(0).toUpperCase() + page.slice(1);
            document.getElementById('postForm').style.display = page === 'home' ? 'block' : 'none';
            document.getElementById('exploreForm').style.display = page === 'explore' ? 'block' : 'none';
            document.getElementById('notifications').style.display = page === 'notifications' ? 'block' : 'none';
            document.getElementById('profile').style.display = page === 'profile' ? 'block' : 'none';
            document.getElementById('postsContainer').style.display = page !== 'notifications' && page !== 'profile' ? 'block' : 'none';

            if (page === 'notifications') fetchNotifications();
            if (page === 'profile') showProfile();
            if (page === 'home' || page === 'explore') fetchPosts();
        }

        // Fetch posts from JSONBin.io
        async function fetchPosts(filter = '') {
            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                let posts = data.record.posts || [];
                const users = data.record.users || [];
                if (filter) {
                    posts = posts.filter(post => post.content.toLowerCase().includes(filter.toLowerCase()));
                }
                displayPosts(posts, users);
            } catch (error) {
                console.error('Error fetching posts:', error);
                alert('Failed to load posts.');
            }
        }

        // Display posts
        function displayPosts(posts, users) {
            const postsContainer = document.getElementById('postsContainer');
            postsContainer.innerHTML = '';
            posts.reverse().forEach(post => {
                const user = users.find(u => u.username === post.username) || { verified: false };
                const postElement = document.createElement('div');
                postElement.className = 'post';
                postElement.innerHTML = `
                    <div class="post-header">
                        <img src="${post.profilePic}" alt="Profile Pic" onerror="this.outerHTML='<div>🕊️</div>'">
                        <div>
                            <span class="username">${post.username}${user.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}</span>
                            <span class="handle">${post.handle}</span>
                        </div>
                    </div>
                    <div class="post-content">${post.content}</div>
                    <div class="post-meta">${new Date(post.timestamp).toLocaleString()}</div>
                    <div class="post-actions">
                        <span><i class="fas fa-comment" onclick="toggleCommentForm('${post.id}')"></i> ${post.comments.length}</span>
                        <span><i class="${post.likes.includes(currentUser.username) ? 'fas fa-heart liked' : 'far fa-heart'}" onclick="toggleLike('${post.id}')"></i> ${post.likes.length}</span>
                        <span><i class="${post.shares.includes(currentUser.username) ? 'fas fa-share shared' : 'fas fa-share'}" onclick="sharePost('${post.id}')"></i> ${post.shares.length}</span>
                    </div>
                    <div class="comment-section" id="commentSection${post.id}" style="display: none;">
                        <div class="comment-form">
                            <input type="text" id="commentInput${post.id}" placeholder="Add a comment...">
                            <i class="fas fa-dove" onclick="toggleStickerPicker('commentStickerPicker${post.id}')"></i>
                            <div class="sticker-picker" id="commentStickerPicker${post.id}">
                                <span onclick="addSticker('commentInput${post.id}', '🕊️')">🕊️</span>
                                <span onclick="addSticker('commentInput${post.id}', '🦜')">🦜</span>
                                <span onclick="addSticker('commentInput${post.id}', '🦅')">🦅</span>
                                <span onclick="addSticker('commentInput${post.id}', '🐦')">🐦</span>
                                <span onclick="addSticker('commentInput${post.id}', '🦢')">🦢</span>
                            </div>
                            <button onclick="addComment('${post.id}')">Comment</button>
                        </div>
                        ${post.comments.map(comment => {
                            const commentUser = users.find(u => u.username === comment.username) || { verified: false };
                            return `
                                <div class="comment">
                                    <img src="${comment.profilePic}" alt="Profile Pic" onerror="this.outerHTML='<div>🕊️</div>'">
                                    <div class="comment-content">
                                        <span class="username">${comment.username}${commentUser.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}</span>
                                        <span class="handle">${comment.handle}</span>
                                        <p>${comment.content}</p>
                                        <span class="post-meta">${new Date(comment.timestamp).toLocaleString()}</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
                postsContainer.appendChild(postElement);
            });
        }

        // Create a new post
        async function createPost() {
            const postContent = document.getElementById('postContent').value.trim();
            if (!postContent) {
                alert('Please enter some content to post.');
                return;
            }

            const newPost = {
                id: Date.now().toString(),
                username: currentUser.username,
                handle: currentUser.handle,
                profilePic: DEFAULT_PROFILE_PIC,
                content: postContent,
                timestamp: new Date().toISOString(),
                likes: [],
                comments: [],
                shares: []
            };

            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const posts = data.record.posts || [];
                posts.push(newPost);

                const notification = {
                    id: Date.now().toString(),
                    type: 'post',
                    user: currentUser.username,
                    content: `${currentUser.username} posted a new update.`,
                    timestamp: new Date().toISOString()
                };
                const notifications = data.record.notifications || [];
                notifications.push(notification);

                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_X_MASTER_KEY
                    },
                    body: JSON.stringify({ posts, users: data.record.users || [], notifications })
                });

                document.getElementById('postContent').value = '';
                document.getElementById('postStickerPicker').style.display = 'none';
                fetchPosts();
            } catch (error) {
                console.error('Error creating post:', error);
                alert('Failed to create post. Please try again.');
            }
        }

        // Toggle like on a post
        async function toggleLike(postId) {
            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const posts = data.record.posts || [];
                const post = posts.find(p => p.id === postId);
                if (post) {
                    const index = post.likes.indexOf(currentUser.username);
                    if (index === -1) {
                        post.likes.push(currentUser.username);
                        const notification = {
                            id: Date.now().toString(),
                            type: 'like',
                            user: newUser.username,
                            content: `${currentUser.username} liked a post.`,
                            timestamp: new Date().toISOString()
                        };
                        const notifications = data.record.notifications || [];
                        notifications.push(notification);
                        await fetch(JSONBIN_URL, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Master-Key': JSONBIN_X_MASTER_KEY
                            },
                            body: JSON.stringify({ posts, users: data.record.users || [], notifications })
                        });
                    } else {
                        post.likes.splice(index, 1);
                        await fetch(JSONBIN_URL, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Master-Key': JSONBIN_X_MASTER_KEY
                            },
                            body: JSON.stringify({ posts, users: data.record.users || [], notifications: data.record.notifications || [] })
                        });
                    }
                    fetchPosts();
                }
            } catch (error) {
                console.error('Error toggling like:', error);
                alert('Failed to like post.');
            }
        }

        // Share a post
        async function sharePost(postId) {
            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const posts = data.record.posts || [];
                const post = posts.find(p => p.id === postId);
                if (post) {
                    const index = post.shares.indexOf(currentUser.username);
                    if (index === -1) {
                        post.shares.push(currentUser.username);
                        const notification = {
                            id: Date.now().toString(),
                            type: 'share',
                            user: currentUser.username,
                            content: `${currentUser.username} shared a post.`,
                            timestamp: new Date().toISOString()
                        };
                        const notifications = data.record.notifications || [];
                        notifications.push(notification);
                        await fetch(JSONBIN_URL, {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Master-Key': JSONBIN_X_MASTER_KEY
                            },
                            body: JSON.stringify({ posts, users: data.record.users || [], notifications })
                        });
                        const shareUrl = `${window.location.href}#post-${postId}`;
                        await navigator.clipboard.writeText(shareUrl);
                        alert('Post URL copied to clipboard!');
                    }
                    fetchPosts();
                }
            } catch (error) {
                console.error('Error sharing post:', error);
                alert('Failed to share post.');
            }
        }

        // Toggle comment form
        function toggleCommentForm(postId) {
            const commentSection = document.getElementById(`commentSection${postId}`);
            commentSection.style.display = commentSection.style.display === 'none' ? 'block' : 'none';
        }

        // Add a comment
        async function addComment(postId) {
            const commentInput = document.getElementById(`commentInput${postId}`);
            const content = commentInput.value.trim();
            if (!content) {
                alert('Please enter a comment.');
                return;
            }

            const newComment = {
                username: currentUser.username,
                handle: currentUser.handle,
                profilePic: DEFAULT_PROFILE_PIC,
                content,
                timestamp: new Date().toISOString()
            };

            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const posts = data.record.posts || [];
                const post = posts.find(p => p.id === postId);
                if (post) {
                    post.comments.push(newComment);
                    const notification = {
                        id: Date.now().toString(),
                        type: 'comment',
                        user: currentUser.username,
                        content: `${currentUser.username} commented on a post.`,
                        timestamp: new Date().toISOString()
                    };
                    const notifications = data.record.notifications || [];
                    notifications.push(notification);
                    await fetch(JSONBIN_URL, {
                        method: 'PUT',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-Master-Key': JSONBIN_X_MASTER_KEY
                        },
                        body: JSON.stringify({ posts, users: data.record.users || [], notifications })
                    });
                    commentInput.value = '';
                    document.getElementById(`commentStickerPicker${postId}`).style.display = 'none';
                    fetchPosts();
                }
            } catch (error) {
                console.error('Error adding comment:', error);
                alert('Failed to add comment.');
            }
        }

        // Search posts
        function searchPosts() {
            const query = document.getElementById('searchInput').value.trim();
            fetchPosts(query);
        }

        // Fetch and display notifications
        async function fetchNotifications() {
            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const notifications = data.record.notifications || [];
                const notificationsContainer = document.getElementById('notifications');
                notificationsContainer.innerHTML = '';
                notifications.reverse().forEach(notification => {
                    const notificationElement = document.createElement('div');
                    notificationElement.className = 'notification';
                    notificationElement.innerHTML = `
                        <div>${notification.content}</div>
                        <div class="post-meta">${new Date(notification.timestamp).toLocaleString()}</div>
                    `;
                    notificationsContainer.appendChild(notificationElement);
                });
            } catch (error) {
                console.error('Error fetching notifications:', error);
                alert('Failed to load notifications.');
            }
        }

        // Show profile page
        async function showProfile() {
            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const posts = data.record.posts || [];
                const userPosts = posts.filter(post => post.username === currentUser.username);
                const profileContainer = document.getElementById('profile');
                profileContainer.innerHTML = `
                    <div class="profile-header">
                        <img src="${currentUser.profilePic}" alt="Profile Pic" onerror="this.outerHTML='<div>🕊️</div>'">
                        <h2>${currentUser.username}${currentUser.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}</h2>
                        <p>${currentUser.handle}</p>
                        <p>${currentUser.bio}</p>
                        <p>Joined ${currentUser.joined}</p>
                        <button onclick="showEditProfileForm()">Edit Profile</button>
                    </div>
                    <div id="editProfileForm" style="display: none; padding: 20px;">
                        <input type="text" id="editUsername" value="${currentUser.username}" placeholder="Username">
                        <input type="text" id="editHandle" value="${currentUser.handle}" placeholder="Handle">
                        <textarea id="editBio" placeholder="Bio">${currentUser.bio}</textarea>
                        <label><input type="checkbox" id="editVerified" ${currentUser.verified ? 'checked' : ''}> Verified</label>
                        <button onclick="updateProfile()">Save Changes</button>
                        <button onclick="document.getElementById('editProfileForm').style.display='none'">Cancel</button>
                    </div>
                `;
                const postsContainer = document.createElement('div');
                postsContainer.className = 'posts';
                const users = data.record.users || [];
                userPosts.reverse().forEach(post => {
                    const user = users.find(u => u.username === post.username) || { verified: false };
                    const postElement = document.createElement('div');
                    postElement.className = 'post';
                    postElement.innerHTML = `
                        <div class="post-header">
                            <img src="${post.profilePic}" alt="Profile Pic" onerror="this.outerHTML='<div>🕊️</div>'">
                            <div>
                                <span class="username">${post.username}${user.verified ? '<i class="fas fa-check-circle verified-badge"></i>' : ''}</span>
                                <span class="handle">${post.handle}</span>
                            </div>
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-meta">${new Date(post.timestamp).toLocaleString()}</div>
                        <div class="post-actions">
                            <span><i class="fas fa-comment" onclick="toggleCommentForm('${post.id}')"></i> ${post.comments.length}</span>
                            <span><i class="${post.likes.includes(currentUser.username) ? 'fas fa-heart liked' : 'far fa-heart'}" onclick="toggleLike('${post.id}')"></i> ${post.likes.length}</span>
                            <span><i class="${post.shares.includes(currentUser.username) ? 'fas fa-share shared' : 'fas fa-share'}" onclick="sharePost('${post.id}')"></i> ${post.shares.length}</span>
                        </div>
                    `;
                    postsContainer.appendChild(postElement);
                });
                profileContainer.appendChild(postsContainer);
            } catch (error) {
                console.error('Error loading profile:', error);
                alert('Failed to load profile.');
            }
        }

        // Show edit profile form
        function showEditProfileForm() {
            document.getElementById('editProfileForm').style.display = 'block';
        }

        // Update profile
        async function updateProfile() {
            const username = document.getElementById('editUsername').value.trim();
            const handle = document.getElementById('editHandle').value.trim();
            const bio = document.getElementById('editBio').value.trim();
            const verified = document.getElementById('editVerified').checked;

            if (!username || !handle) {
                alert('Username and handle are required.');
                return;
            }
            if (!handle.startsWith('@')) {
                alert('Handle must start with @.');
                return;
            }

            try {
                const response = await fetch(JSONBIN_URL, {
                    headers: { 'X-Master-Key': JSONBIN_X_MASTER_KEY }
                });
                const data = await response.json();
                const users = data.record.users || [];
                const posts = data.record.posts || [];

                // Check for conflicts
                if (users.find(u => u.username === username && u.username !== currentUser.username)) {
                    alert('Username already exists.');
                    return;
                }
                if (users.find(u => u.handle === handle && u.handle !== currentUser.handle)) {
                    alert('Handle already exists.');
                    return;
                }

                // Update user
                const userIndex = users.findIndex(u => u.username === currentUser.username);
                const oldUsername = currentUser.username;
                const oldHandle = currentUser.handle;
                currentUser = { ...currentUser, username, handle, bio, profilePic: DEFAULT_PROFILE_PIC, verified };
                users[userIndex] = currentUser;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));

                // Update posts and comments
                posts.forEach(post => {
                    if (post.username === oldUsername) {
                        post.username = username;
                        post.handle = handle;
                        post.profilePic = DEFAULT_PROFILE_PIC;
                    }
                    post.comments.forEach(comment => {
                        if (comment.username === oldUsername) {
                            comment.username = username;
                            comment.handle = handle;
                            comment.profilePic = DEFAULT_PROFILE_PIC;
                        }
                    });
                });

                await fetch(JSONBIN_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': JSONBIN_X_MASTER_KEY
                    },
                    body: JSON.stringify({ ...data.record, users, posts })
                });

                document.getElementById('editProfileForm').style.display = 'none';
                showProfile();
            } catch (error) {
                console.error('Error updating profile:', error);
                alert('Failed to update profile.');
            }
        }

        // Toggle sticker picker
        function toggleStickerPicker(pickerId) {
            const picker = document.getElementById(pickerId);
            picker.style.display = picker.style.display === 'block' ? 'none' : 'block';
        }

        // Add sticker to input
        function addSticker(inputId, sticker) {
            const input = document.getElementById(inputId);
            input.value += sticker;
            input.focus();
            document.querySelectorAll('.sticker-picker').forEach(picker => picker.style.display = 'none');
        }

        // Logout
        function logout() {
            localStorage.removeItem('currentUser');
            currentUser = null;
            document.getElementById('loginModal').style.display = 'flex';
            document.getElementById('postsContainer').innerHTML = '';
        }

        // Periodic refresh
        setInterval(() => {
            if (currentUser && document.getElementById('postsContainer').style.display === 'block') {
                fetchPosts(document.getElementById('searchInput')?.value || '');
            }
            if (currentUser && document.getElementById('notifications').style.display === 'block') {
                fetchNotifications();
            }
        }, 30000);

        // Initial load
        if (currentUser) {
            showPage('home');
        }
    </script>
</body>
</html>
