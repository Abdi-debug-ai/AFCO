<!DOCTYPE html>
<html>
<head>
  <title>PlayStation Access Request</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      margin: 0; padding: 20px;
    }
    h2 { color: #333; }
    .section { background: white; padding: 15px; margin-bottom: 20px; border-radius: 8px; box-shadow: 0 0 5px rgba(0,0,0,0.1);}
    select, input, button, textarea {
      padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box;
    }
    button { cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
    .log { margin-top: 10px; border-top: 1px solid #ccc; padding-top: 10px; }
    .approved { color: green; }
    .rejected { color: red; }
    .pending { color: orange; }
    .admin-buttons button {
      width: 100px; margin-right: 10px;
    }
  </style>
</head>
<body>

  <div class="section">
    <h2>🎮 PlayStation Access Request Form</h2>
    <label>Brother's Name:</label>
    <input type="text" id="name" required>

    <label>Select Game:</label>
    <select id="game">
      <option>Roblox</option>
      <option>Need for Speed</option>
      <option>Gran Turismo</option>
      <option>Asphalt</option>
      <option>Rocket League</option>
      <option>Spider Man Marvel</option>
      <option>Batman Arkham Knight</option>
      <option>Role Plays</option>
      <option>Others (Specify Below)</option>
    </select>
    <textarea id="otherGame" placeholder="If 'Others', type game name..."></textarea>

    <label>Day:</label>
    <select id="day">
      <option>Monday</option>
      <option>Tuesday</option>
      <option>Wednesday</option>
      <option>Thursday</option>
      <option>Friday</option>
      <option>Saturday</option>
      <option>Sunday</option>
    </select>

    <label>Time:</label>
    <input type="time" id="time">

    <label>Are you on holiday?</label>
    <select id="holiday">
      <option value="no">School Term</option>
      <option value="yes">Holiday</option>
    </select>

    <button onclick="submitRequest()">Submit Request</button>
  </div>

  <div class="section">
    <h2>🧾 View My Requests</h2>
    <div id="userLogs"></div>
  </div>

  <div class="section">
    <h2>🔐 Admin Panel</h2>
    <input type="password" id="adminPass" placeholder="Enter admin password">
    <button onclick="loginAdmin()">Login</button>
    <div id="adminPanel" style="display:none;">
      <h3>All Requests</h3>
      <div id="adminLogs"></div>
      <button onclick="downloadPDF()">Download PDF</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script>
    const allowedGames = ["Roblox", "Need for Speed", "Gran Turismo", "Asphalt", "Rocket League"];
    const reviewGames = ["Spider Man Marvel", "Batman Arkham Knight", "Role Plays"];
    const restrictedKeywords = ["pg", "mature", "violence", "blood"];

    function getStatus(game, otherGame, time, day, holiday) {
      const hour = parseInt(time.split(':')[0]);
      const minutes = parseInt(time.split(':')[1]);
      const timeFloat = hour + minutes / 60;

      if (["Monday", "Tuesday", "Wednesday", "Thursday"].includes(day) && holiday === "no") {
        return "Rejected (Weekdays restricted)";
      }

      if (day === "Friday" && holiday === "no" && (timeFloat < 16 || timeFloat >= 21)) {
        return "Rejected (Allowed 4PM-9PM)";
      }

      if (["Saturday", "Sunday"].includes(day) && holiday === "no") {
        if ((timeFloat >= 9 && timeFloat <= 12) || timeFloat >= 21) {
          return "Rejected (Madrassa or late hours)";
        }
        if (timeFloat < 6 || timeFloat > 21) {
          return "Rejected (Only 6AM–9AM, 12PM–9PM)";
        }
      }

      if (holiday === "yes" && timeFloat >= 21) {
        return "Rejected (Late night hours)";
      }

      const gameLower = (game + " " + otherGame).toLowerCase();
      for (let keyword of restrictedKeywords) {
        if (gameLower.includes(keyword)) return "Rejected (Inappropriate game)";
      }

      if (allowedGames.includes(game)) return "Approved";
      if (reviewGames.includes(game) || game === "Others (Specify Below)" || otherGame.trim()) {
        return "Pending Review";
      }

      return "Rejected (Unknown game)";
    }

    function submitRequest() {
      const name = document.getElementById("name").value;
      const game = document.getElementById("game").value;
      const otherGame = document.getElementById("otherGame").value;
      const day = document.getElementById("day").value;
      const time = document.getElementById("time").value;
      const holiday = document.getElementById("holiday").value;

      if (!name || !time) return alert("Please fill in all fields!");

      const status = getStatus(game, otherGame, time, day, holiday);
      const request = {
        name, game, otherGame, day, time, holiday,
        status, date: new Date().toLocaleString()
      };

      const logs = JSON.parse(localStorage.getItem("psLogs") || "[]");
      logs.unshift(request);
      localStorage.setItem("psLogs", JSON.stringify(logs));

      alert("Request submitted!");
      displayUserLogs();
      if (document.getElementById("adminPanel").style.display === "block") displayAdminLogs();
    }

    function displayUserLogs() {
      const logs = JSON.parse(localStorage.getItem("psLogs") || "[]");
      const container = document.getElementById("userLogs");
      container.innerHTML = logs.map(log => `
        <div class="log">
          <b>${log.name}</b> requested <i>${log.game} ${log.otherGame}</i> on ${log.day} at ${log.time} (${log.holiday === "yes" ? "Holiday" : "Term"})<br>
          <span class="${log.status.includes('Approved') ? 'approved' : log.status.includes('Rejected') ? 'rejected' : 'pending'}">${log.status}</span>
        </div>
      `).join("");
    }

    function displayAdminLogs() {
      const logs = JSON.parse(localStorage.getItem("psLogs") || "[]");
      const container = document.getElementById("adminLogs");
      container.innerHTML = logs.map((log, i) => `
        <div class="log">
          <b>${log.name}</b> requested <i>${log.game} ${log.otherGame}</i> on ${log.day} at ${log.time} (${log.holiday === "yes" ? "Holiday" : "Term"})<br>
          <span class="${log.status.includes('Approved') ? 'approved' : log.status.includes('Rejected') ? 'rejected' : 'pending'}">${log.status}</span>
          ${log.status === "Pending Review" ? `
            <div class="admin-buttons">
              <button onclick="updateStatus(${i}, 'Approved by Admin')">✅ Approve</button>
              <button onclick="updateStatus(${i}, 'Rejected by Admin')">❌ Reject</button>
            </div>
          ` : ""}
        </div>
      `).join("");
    }

    function updateStatus(index, newStatus) {
      const logs = JSON.parse(localStorage.getItem("psLogs") || "[]");
      logs[index].status = newStatus;
      localStorage.setItem("psLogs", JSON.stringify(logs));
      displayAdminLogs();
      displayUserLogs();
    }

    function loginAdmin() {
      const pass = document.getElementById("adminPass").value;
      if (pass === "Nassir123") {
        document.getElementById("adminPanel").style.display = "block";
        displayAdminLogs();
      } else {
        alert("Wrong password!");
      }
    }

    async function downloadPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const logs = JSON.parse(localStorage.getItem("psLogs") || "[]");

      doc.setFontSize(14);
      doc.text("PlayStation Access Logs", 10, 10);

      logs.forEach((log, i) => {
        const y = 20 + i * 10;
        doc.text(`${log.name} - ${log.game} ${log.otherGame} - ${log.day} ${log.time} (${log.holiday}) - ${log.status}`, 10, y);
      });

      doc.save("PlayStation_Logs.pdf");
    }

    displayUserLogs();
  </script>

</body>
</html>
